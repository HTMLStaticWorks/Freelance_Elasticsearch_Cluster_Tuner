<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Freelance Elasticsearch Cluster Tuner</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        .auth-card {
            max-width: 450px;
            width: 100%;
        }
        .social-btn {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            transition: all 0.2s;
            color: var(--dark-color);
            text-decoration: none;
            background-color: var(--light-color);
        }
        .social-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--primary-color);
        }
        [data-bs-theme="dark"] .social-btn {
            border-color: rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.05);
        }
        [data-bs-theme="dark"] .social-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        [data-bs-theme="dark"] .bg-white {
            background-color: transparent !important;
        }
    </style>
</head>
<body class="bg-light">

    <div class="position-fixed top-0 end-0 p-3 z-3 d-flex gap-2">
        <button class="btn btn-outline-primary rounded-circle rtl-toggle-btn d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" title="Toggle RTL/LTR">
            <span class="fw-bold" style="font-size: 13px;">RTL</span>
        </button>
        <button class="btn btn-outline-primary rounded-circle theme-toggle-btn d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" title="Toggle Theme">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5 pt-lg-5 pt-5 mt-5 mt-lg-0">
        <div class="card auth-card p-4 p-md-5 border-0 shadow-lg rounded-4">
            <div class="text-center mb-4">
                <a href="index.html" class="navbar-brand justify-content-center mb-4">
                    <i class="bi bi-diagram-3-fill"></i>
                    <span>ES Tuner</span>
                </a>
                <h3 class="fw-bold mt-3">Welcome Back</h3>
                <p class="text-muted">Login to manage your clusters</p>
            </div>

            <form action="dashboard.html">
                <div class="mb-3">
                    <label class="form-label fw-600">Email Address</label>
                    <input type="email" class="form-control py-3" placeholder="name@company.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-600">Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control py-3" id="password" placeholder="••••••••" required>
                        <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer toggle-password" data-target="password"></i>
                    </div>
                </div>
                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="form-check mb-0">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label small" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="small text-primary text-decoration-none fw-bold">Forgot?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 mb-4">Sign In</button>
            </form>

            <div class="text-center mb-4 position-relative">
                <hr>
                <span class="bg-white px-3 position-absolute top-50 start-50 translate-middle text-muted small">Or continue with</span>
            </div>

            <div class="row g-3">
                <div class="col-6">
                    <a href="#" class="social-btn"><i class="bi bi-google me-2"></i>Google</a>
                </div>
                <div class="col-6">
                    <a href="#" class="social-btn"><i class="bi bi-apple me-2"></i>Apple</a>
                </div>
            </div>

            <div class="text-center mt-5">
                <p class="text-muted small">Don't have an account? <a href="register.html" class="text-primary fw-bold">Sign up</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
