<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Freelance Elasticsearch Cluster Tuner</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        .auth-card {
            max-width: 500px;
            width: 100%;
        }
        .social-btn {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            transition: all 0.2s;
            color: #1e293b;
            text-decoration: none;
        }
        .social-btn:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-light">

    <div class="position-fixed top-0 end-0 p-3 z-3 d-flex gap-2">
        <button id="rtlToggle" class="btn btn-link p-0" title="Toggle RTL/LTR">
            <span class="small fw-bold">RTL</span>
        </button>
        <button id="themeToggle" class="btn btn-link p-0" title="Toggle Theme">
            <i class="bi bi-moon-fill fs-4"></i>
        </button>
    </div>

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="card auth-card p-4 p-md-5 border-0 shadow-lg rounded-4">
            <div class="text-center mb-4">
                <a href="index.html" class="navbar-brand justify-content-center mb-4">
                    <i class="bi bi-diagram-3-fill fs-1"></i>
                    <span class="fs-2">ES Tuner</span>
                </a>
                <h3 class="fw-bold mt-3">Create Account</h3>
                <p class="text-muted">Join the elite cluster optimization community</p>
            </div>

            <form action="dashboard.html">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-600">First Name</label>
                        <input type="text" class="form-control py-3" placeholder="John" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-600">Last Name</label>
                        <input type="text" class="form-control py-3" placeholder="Doe" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-600">Work Email</label>
                        <input type="email" class="form-control py-3" placeholder="john@company.com" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-600">Password</label>
                        <div class="position-relative">
                            <input type="password" class="form-control py-3" id="password" placeholder="Create a strong password" required>
                            <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer toggle-password" data-target="password"></i>
                        </div>
                        <div class="form-text small">Must be at least 8 characters.</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-600">Confirm Password</label>
                        <div class="position-relative">
                            <input type="password" class="form-control py-3" id="confirmPassword" placeholder="Repeat your password" required>
                            <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer toggle-password" data-target="confirmPassword"></i>
                        </div>
                    </div>
                </div>
                <div class="mb-4 mt-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label small" for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 mb-4">Create Account</button>
            </form>

            <div class="text-center mb-4 position-relative">
                <hr>
                <span class="bg-white px-3 position-absolute top-50 start-50 translate-middle text-muted small">Or sign up with</span>
            </div>

            <div class="row g-3">
                <div class="col-6">
                    <a href="#" class="social-btn"><i class="bi bi-google me-2"></i>Google</a>
                </div>
                <div class="col-6">
                    <a href="#" class="social-btn"><i class="bi bi-apple me-2"></i>Apple</a>
                </div>
            </div>

            <div class="text-center mt-5">
                <p class="text-muted small">Already have an account? <a href="login.html" class="text-primary fw-bold">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
