<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Freelance Elasticsearch Cluster Tuner</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <i class="bi bi-diagram-3-fill"></i>
                    <span>ES Tuner</span>
                </a>
                <div class="d-flex align-items-center order-lg-last ms-2">
                    <button id="themeToggle" class="btn btn-link text-dark p-0" title="Toggle Theme">
                        <i class="bi bi-moon-fill fs-4"></i>
                    </button>
                    <button class="navbar-toggler ms-3 border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container">
            <div class="row g-5">
                <!-- Contact Info -->
                <div class="col-lg-4">
                    <h2 class="fw-bold mb-4">Get in Touch</h2>
                    <p class="text-muted mb-5">Have questions about your cluster performance? Our team is ready to help.</p>
                    
                    <div class="d-flex mb-4">
                        <div class="bg-primary-subtle text-primary p-3 rounded-circle me-3">
                            <i class="bi bi-geo-alt fs-4"></i>
                        </div>
                        <div>
                            <h6 class="fw-bold mb-0">Our Office</h6>
                            <p class="text-muted small">123 Tech Avenue, Silicon Valley, CA</p>
                        </div>
                    </div>
                    <div class="d-flex mb-4">
                        <div class="bg-primary-subtle text-primary p-3 rounded-circle me-3">
                            <i class="bi bi-envelope fs-4"></i>
                        </div>
                        <div>
                            <h6 class="fw-bold mb-0">Email Us</h6>
                            <p class="text-muted small">support@estuner.com</p>
                        </div>
                    </div>
                    <div class="d-flex mb-4">
                        <div class="bg-primary-subtle text-primary p-3 rounded-circle me-3">
                            <i class="bi bi-telephone fs-4"></i>
                        </div>
                        <div>
                            <h6 class="fw-bold mb-0">Call Us</h6>
                            <p class="text-muted small">+1 (555) 000-ESTUNE</p>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="col-lg-8">
                    <div class="card p-4 p-md-5 border-0 shadow-sm">
                        <form>
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Full Name</label>
                                    <input type="text" class="form-control" placeholder="John Doe">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Email Address</label>
                                    <input type="email" class="form-control" placeholder="john@example.com">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Subject</label>
                                    <select class="form-select">
                                        <option>Cluster Audit</option>
                                        <option>Performance Optimization</option>
                                        <option>General Inquiry</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Message</label>
                                    <textarea class="form-control" rows="5" placeholder="Tell us about your cluster..."></textarea>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary btn-lg px-5">Send Message</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Google Map Mockup -->
            <div class="row mt-5">
                <div class="col-12">
                    <div class="rounded-4 overflow-hidden shadow-sm" style="height: 400px;">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3168.639290622367!2d-122.0838511!3d37.4224764!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb92447434771%3A0x6b6c0e5a9c0c1b!2sGoogleplex!5e0!3m2!1sen!2sus!4v1637321524354!5m2!1sen!2sus" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center py-4">
            <p class="mb-0">© 2026 ES Tuner. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
