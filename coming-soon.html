<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | ES Tuner</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        .timer-box {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 12px;
            min-width: 100px;
        }
    </style>
</head>
<body class="bg-primary text-white">
    <div class="position-fixed top-0 end-0 p-3 z-3 d-flex gap-2">
        <button class="btn btn-outline-light rounded-circle rtl-toggle-btn d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" title="Toggle RTL/LTR">
            <span class="fw-bold" style="font-size: 13px;">RTL</span>
        </button>
        <button class="btn btn-outline-light rounded-circle theme-toggle-btn d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" title="Toggle Theme">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center text-center py-5 pt-lg-5 pt-5 mt-5 mt-lg-0">
        <div class="fade-in">
            <i class="bi bi-gear-wide-connected fs-1 mb-4"></i>
            <h1 class="display-3 fw-bold mb-3">Re-indexing in Progress</h1>
            <p class="lead mb-5 opacity-75">We are currently updating our documentation and tools. We'll be back shortly.</p>
            
            <div class="d-flex justify-content-center gap-3 mb-5">
                <div class="timer-box shadow">
                    <h2 class="fw-bold mb-0">05</h2>
                    <div class="small">Days</div>
                </div>
                <div class="timer-box shadow">
                    <h2 class="fw-bold mb-0">12</h2>
                    <div class="small">Hours</div>
                </div>
                <div class="timer-box shadow">
                    <h2 class="fw-bold mb-0">45</h2>
                    <div class="small">Minutes</div>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-6">
                    <p class="mb-4">Notify me when the index is ready:</p>
                    <div class="input-group">
                        <input type="email" class="form-control form-control-lg" placeholder="Enter your email">
                        <button class="btn btn-secondary btn-lg" type="button">Notify Me</button>
                    </div>
                </div>
            </div>

            <div class="mt-5">
                <a href="index.html" class="text-white opacity-50 text-decoration-none small">Back to Preview</a>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
